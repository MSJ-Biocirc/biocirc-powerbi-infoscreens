<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>BioCirc Power BI Infoscreen - Enterprise</title>

<script src="https://cdn.jsdelivr.net/npm/powerbi-client@2.23.1/dist/powerbi.min.js"></script>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: black;
    overflow: hidden;
    font-family: "Segoe UI", Arial, sans-serif;
}

body {
    position: relative;
}

#app {
    position: fixed;
    inset: 0;
    background: black;
    overflow: hidden;
}

.report-frame {
    position: absolute;
    inset: 0;
    width: 100vw;
    height: 100vh;
    background: black;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity 450ms ease-in-out, visibility 450ms ease-in-out;
}

.report-frame.active {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
}

.report-frame > iframe {
    border: none !important;
}

#loading {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: black;
    color: rgba(255, 255, 255, 0.78);
    font-size: 26px;
    letter-spacing: 0.2px;
    z-index: 50;
}

#loading.hidden {
    display: none;
}

#loadingBox {
    text-align: center;
}

#loadingTitle {
    font-size: 28px;
    margin-bottom: 14px;
}

#loadingSubtitle {
    font-size: 15px;
    opacity: 0.55;
}

#progress {
    position: fixed;
    left: 0;
    bottom: 0;
    height: 3px;
    width: 0%;
    background: rgba(255, 255, 255, 0.55);
    z-index: 60;
    transition: width 250ms linear;
}

#error {
    position: fixed;
    top: 24px;
    left: 24px;
    right: 24px;
    color: white;
    background: #990000;
    padding: 18px 22px;
    font-size: 17px;
    line-height: 1.45;
    display: none;
    z-index: 100;
    white-space: pre-wrap;
    box-shadow: 0 8px 28px rgba(0, 0, 0, 0.45);
}

#status {
    position: fixed;
    right: 16px;
    bottom: 12px;
    color: rgba(255, 255, 255, 0.35);
    font-size: 12px;
    z-index: 70;
    display: none;
}

#status.visible {
    display: block;
}
</style>
</head>

<body>

<div id="app">
    <div id="frames"></div>
</div>

<div id="loading">
    <div id="loadingBox">
        <div id="loadingTitle">Loading reports...</div>
        <div id="loadingSubtitle">BioCirc Power BI Infoscreen</div>
    </div>
</div>

<div id="progress"></div>
<div id="error"></div>
<div id="status"></div>

<script>
//////////////////////////////////////////////////////
// CONFIG
//////////////////////////////////////////////////////

const defaultSite = "Vesthimmerland";
const configFolder = "configs";

//////////////////////////////////////////////////////
// HELPERS
//////////////////////////////////////////////////////

function getSiteFromUrl() {
    const p = new URLSearchParams(window.location.search);
    return p.get("site") || defaultSite;
}

function showError(message) {
    const el = document.getElementById("error");
    el.textContent = message;
    el.style.display = "block";
    console.error(message);
}

function clearError() {
    const el = document.getElementById("error");
    el.textContent = "";
    el.style.display = "none";
}

function setStatus(message) {
    const el = document.getElementById("status");
    el.textContent = message || "";
    el.classList.toggle("visible", Boolean(message));
}

function setProgress(current, total) {
    const el = document.getElementById("progress");

    if (!total || total <= 0) {
        el.style.width = "0%";
        return;
    }

    const pct = Math.round((current / total) * 100);
    el.style.width = `${pct}%`;
}

function sleep(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
}

async function fetchJson(url, options = {}) {
    const response = await fetch(url, options);
    const text = await response.text();

    let body;
    try {
        body = text ? JSON.parse(text) : null;
    } catch {
        body = text;
    }

    if (!response.ok) {
        throw new Error(`HTTP ${response.status}: ${JSON.stringify(body)}`);
    }

    return body;
}

async function getEmbedConfig(item) {
    return fetchJson("/api/getEmbedConfig", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            name: item.name,
            reportId: item.reportId,
            groupId: item.groupId,
            pageName: item.pageName
        })
    });
}

function getPowerBiModels() {
    if (!window["powerbi-client"] || !window["powerbi-client"].models) {
        throw new Error("Power BI JavaScript client is not loaded.");
    }

    return window["powerbi-client"].models;
}

function embedReport(container, embedConfig) {
    const models = getPowerBiModels();

    const config = {
        type: "report",
        id: embedConfig.reportId,
        embedUrl: embedConfig.embedUrl,
        accessToken: embedConfig.accessToken,
        tokenType: models.TokenType.Embed,
        pageName: embedConfig.pageName,
        permissions: models.Permissions.Read,
        settings: {
            panes: {
                filters: {
                    expanded: false,
                    visible: false
                },
                pageNavigation: {
                    visible: false
                }
            },
            bars: {
                actionBar: {
                    visible: false
                }
            },
            navContentPaneEnabled: false,
            filterPaneEnabled: false,
            background: models.BackgroundType.Default
        }
    };

    powerbi.reset(container);

    const report = powerbi.embed(container, config);

    report.on("loaded", function () {
        console.log("Report loaded:", embedConfig.name);
    });

    report.on("rendered", function () {
        console.log("Report rendered:", embedConfig.name);
    });

    report.on("error", function (event) {
        console.error("Power BI embed error:", embedConfig.name, event.detail);
    });

    return report;
}

function createReportContainer(item) {
    const div = document.createElement("div");
    div.className = "report-frame";
    div.setAttribute("data-report-name", item.name || "Unnamed report");

    document.getElementById("frames").appendChild(div);

    return div;
}

//////////////////////////////////////////////////////
// MAIN
//////////////////////////////////////////////////////

(async function () {
    const site = getSiteFromUrl();
    const configPath = `${configFolder}/${site}.json`;

    console.log("Loading site:", site);
    console.log("Config path:", configPath);

    let config;

    try {
        config = await fetchJson(configPath, { cache: "no-store" });
    } catch (error) {
        showError(
            "Kunne ikke loade config:\n" +
            configPath +
            "\n\n" +
            error.message
        );
        return;
    }

    const rotateSeconds = Number(config.rotateSeconds || 30);
    const refreshMinutes = Number(config.refreshMinutes || 30);
    const items = Array.isArray(config.items) ? config.items : [];

    if (items.length === 0) {
        showError("Ingen rapporter i config:\n" + configPath);
        return;
    }

    console.log("Reports loaded:", items.length);

    let reports = [];
    let currentIndex = 0;

    //////////////////////////////////////////////////////
    // LOAD AND EMBED REPORTS
    //////////////////////////////////////////////////////

    for (let i = 0; i < items.length; i++) {
        const item = items[i];

        try {
            setStatus(`Loading ${i + 1}/${items.length}: ${item.name}`);
            setProgress(i, items.length);

            console.log("Getting embed config for:", item.name);

            const embedConfig = await getEmbedConfig(item);
            const container = createReportContainer(item);
            const report = embedReport(container, embedConfig);

            reports.push({
                item,
                container,
                report,
                embedConfig
            });

            setProgress(i + 1, items.length);
        } catch (error) {
            showError(
                "Kunne ikke embedde rapport:\n" +
                (item.name || "Ukendt rapport") +
                "\n\n" +
                error.message
            );
            return;
        }
    }

    if (reports.length === 0) {
        showError("Ingen rapporter kunne indlæses.");
        return;
    }

    await sleep(2500);

    document.getElementById("loading").classList.add("hidden");
    document.getElementById("progress").style.width = "0%";
    setStatus("");

    reports[0].container.classList.add("active");

    //////////////////////////////////////////////////////
    // ROTATION
    //////////////////////////////////////////////////////

    function showReport(index) {
        if (!reports[index]) return;

        reports.forEach((reportInfo, i) => {
            reportInfo.container.classList.toggle("active", i === index);
        });

        currentIndex = index;

        const current = reports[currentIndex];
        console.log("Showing report:", current.item.name);
    }

    function rotate() {
        if (reports.length <= 1) return;

        const nextIndex = currentIndex + 1 >= reports.length ? 0 : currentIndex + 1;
        showReport(nextIndex);
    }

    const rotateMs = Math.max(5, rotateSeconds) * 1000;
    setInterval(rotate, rotateMs);

    //////////////////////////////////////////////////////
    // BACKGROUND TOKEN REFRESH
    //////////////////////////////////////////////////////

    async function refreshReports() {
        console.log("Refreshing embed tokens");

        for (let i = 0; i < reports.length; i++) {
            const reportInfo = reports[i];

            try {
                const newEmbedConfig = await getEmbedConfig(reportInfo.item);

                powerbi.reset(reportInfo.container);

                const newReport = embedReport(reportInfo.container, newEmbedConfig);

                reports[i] = {
                    ...reportInfo,
                    report: newReport,
                    embedConfig: newEmbedConfig
                };

                if (i === currentIndex) {
                    reports[i].container.classList.add("active");
                }

                await sleep(750);
            } catch (error) {
                console.error("Refresh failed for report:", reportInfo.item.name, error);
            }
        }

        console.log("Refresh completed");
    }

    const refreshMs = Math.max(5, refreshMinutes) * 60 * 1000;
    setInterval(refreshReports, refreshMs);

    //////////////////////////////////////////////////////
    // SAFETY: RECOVER AFTER WINDOW RESIZE
    //////////////////////////////////////////////////////

    let resizeTimer = null;

    window.addEventListener("resize", function () {
        clearTimeout(resizeTimer);

        resizeTimer = setTimeout(function () {
            const current = reports[currentIndex];

            if (current && current.report) {
                try {
                    current.report.resize();
                } catch (error) {
                    console.warn("Resize failed:", error);
                }
            }
        }, 500);
    });

    clearError();

    console.log(`
Infoscreen enterprise started
site: ${site}
reports: ${items.length}
rotate: ${rotateSeconds}s
refresh: ${refreshMinutes}m
`);
})();
</script>

</body>
</html>
