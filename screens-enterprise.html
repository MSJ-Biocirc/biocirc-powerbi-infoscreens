<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>BioCirc Power BI Infoscreen - Enterprise</title>

<script src="https://cdn.jsdelivr.net/npm/powerbi-client@2.23.1/dist/powerbi.min.js"></script>

<style>
html, body {
    margin: 0;
    padding: 0;
    background: black;
    overflow: hidden;
    font-family: Segoe UI, Arial, sans-serif;
}

.report-frame {
    position: absolute;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    display: none;
    background: black;
}

#loading {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: white;
    font-size: 26px;
    opacity: 0.7;
    z-index: 50;
}

#error {
    position: absolute;
    top: 20px;
    left: 20px;
    right: 20px;
    color: white;
    background: #900;
    padding: 15px;
    font-size: 18px;
    display: none;
    z-index: 100;
    white-space: pre-wrap;
}
</style>
</head>

<body>

<div id="loading">Loading reports...</div>
<div id="error"></div>
<div id="frames"></div>

<script>
//////////////////////////////////////////////////////
// CONFIG
//////////////////////////////////////////////////////

const defaultSite = "Vesthimmerland";
const configFolder = "configs";

//////////////////////////////////////////////////////
// HELPERS
//////////////////////////////////////////////////////

function getSiteFromUrl() {
    const p = new URLSearchParams(window.location.search);
    return p.get("site") || defaultSite;
}

function showError(message) {
    const el = document.getElementById("error");
    el.textContent = message;
    el.style.display = "block";
    console.error(message);
}

function sleep(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
}

async function getEmbedConfig(item) {
    const response = await fetch("/api/getEmbedConfig", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            name: item.name,
            reportId: item.reportId,
            groupId: item.groupId,
            pageName: item.pageName
        })
    });

    const text = await response.text();

    let body;
    try {
        body = text ? JSON.parse(text) : null;
    } catch {
        body = text;
    }

    if (!response.ok) {
        throw new Error("Backend returned HTTP " + response.status + ": " + JSON.stringify(body));
    }

    return body;
}

function embedReport(container, embedConfig) {
    const models = window["powerbi-client"].models;

    const config = {
        type: "report",
        id: embedConfig.reportId,
        embedUrl: embedConfig.embedUrl,
        accessToken: embedConfig.accessToken,
        tokenType: models.TokenType.Embed,
        pageName: embedConfig.pageName,
        permissions: models.Permissions.Read,
        settings: {
            panes: {
                filters: {
                    visible: false
                },
                pageNavigation: {
                    visible: false
                }
            },
            bars: {
                actionBar: {
                    visible: false
                }
            },
            background: models.BackgroundType.Transparent,
            layoutType: models.LayoutType.Custom,
            customLayout: {
                displayOption: models.DisplayOption.FitToPage
            }
        }
    };

    powerbi.reset(container);
    const report = powerbi.embed(container, config);

    report.on("loaded", function () {
        console.log("Report loaded:", embedConfig.name);
    });

    report.on("rendered", function () {
        console.log("Report rendered:", embedConfig.name);
    });

    report.on("error", function (event) {
        console.error("Power BI embed error:", event.detail);
    });

    return report;
}

//////////////////////////////////////////////////////
// MAIN
//////////////////////////////////////////////////////

(async function () {
    const site = getSiteFromUrl();
    const configPath = `${configFolder}/${site}.json`;

    console.log("Loading site:", site);

    let config;

    try {
        const res = await fetch(configPath, { cache: "no-store" });

        if (!res.ok) {
            throw new Error("Could not load config. HTTP " + res.status);
        }

        config = await res.json();
    } catch (error) {
        showError("Kunne ikke loade config:\n" + configPath + "\n\n" + error.message);
        return;
    }

    const rotateSeconds = Number(config.rotateSeconds || 30);
    const refreshMinutes = Number(config.refreshMinutes || 30);
    const items = Array.isArray(config.items) ? config.items : [];

    if (items.length === 0) {
        showError("Ingen rapporter i config:\n" + configPath);
        return;
    }

    console.log("Reports loaded:", items.length);

    const framesDiv = document.getElementById("frames");

    let frames = [];
    let reports = [];
    let currentIndex = 0;

    //////////////////////////////////////////////////////
    // CREATE CONTAINERS + EMBED REPORTS
    //////////////////////////////////////////////////////

    for (const item of items) {
        try {
            console.log("Getting embed config for:", item.name);

            const embedConfig = await getEmbedConfig(item);

            const div = document.createElement("div");
            div.className = "report-frame";
            framesDiv.appendChild(div);

            const report = embedReport(div, embedConfig);

            frames.push(div);
            reports.push({
                item,
                div,
                report,
                embedConfig
            });
        } catch (error) {
            console.error("Failed to embed report:", item.name, error);
            showError("Kunne ikke embedde rapport:\n" + item.name + "\n\n" + error.message);
            return;
        }
    }

    //////////////////////////////////////////////////////
    // START DISPLAY
    //////////////////////////////////////////////////////

    await sleep(5000);

    document.getElementById("loading").style.display = "none";

    if (frames.length > 0) {
        frames[0].style.display = "block";
    }

    //////////////////////////////////////////////////////
    // ROTATION
    //////////////////////////////////////////////////////

    function rotate() {
        if (frames.length <= 1) return;

        frames[currentIndex].style.display = "none";

        currentIndex++;

        if (currentIndex >= frames.length) {
            currentIndex = 0;
        }

        frames[currentIndex].style.display = "block";
    }

    setInterval(rotate, rotateSeconds * 1000);

    //////////////////////////////////////////////////////
    // TOKEN / REPORT REFRESH
    //////////////////////////////////////////////////////

    async function refreshReports() {
        console.log("Refreshing embed configs");

        for (let i = 0; i < reports.length; i++) {
            try {
                const reportInfo = reports[i];
                const newEmbedConfig = await getEmbedConfig(reportInfo.item);

                powerbi.reset(reportInfo.div);

                const newReport = embedReport(reportInfo.div, newEmbedConfig);

                reports[i] = {
                    ...reportInfo,
                    report: newReport,
                    embedConfig: newEmbedConfig
                };

                await sleep(1000);
            } catch (error) {
                console.error("Refresh failed for report:", reports[i].item.name, error);
            }
        }

        console.log("Refresh completed");
    }

    setInterval(refreshReports, refreshMinutes * 60 * 1000);

    console.log(`
Infoscreen enterprise started
site: ${site}
reports: ${items.length}
rotate: ${rotateSeconds}s
refresh: ${refreshMinutes}m
`);
})();
</script>

</body>
</html>
